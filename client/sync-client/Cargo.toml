[package]
name = "sync-client"
version = "0.1.0"
edition = "2021"
description = "Client for the Rails sync server: typed API + chunk transfer (presigned PUT/GET). The push/pull orchestration that drives fs-provider."
license = "Apache-2.0"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
