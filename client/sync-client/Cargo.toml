[package]
name = "sync-client"
version = "0.1.0"
edition = "2021"
description = "Client for the Rails sync server: typed API + chunk transfer (presigned PUT/GET). The push/pull orchestration that drives fs-provider."
license = "Apache-2.0"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
# Permissive (MIT/Apache). Transports a symlink's target bytes (raw, possibly non-UTF8
# path) over JSON losslessly — base64'd on the wire, decoded back to Vec<u8> here.
base64 = "0.22"
# Blocking WebSocket client for the ActionCable LibraryChannel nudge. rustls to match
# reqwest (no OpenSSL); webpki-roots so wss:// works without the system trust store.
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
