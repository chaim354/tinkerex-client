[package]
name = "fs-winfsp"
version = "0.1.0"
edition = "2021"
description = "WinFsp adapter for fs-provider (the Windows counterpart to fs-fuse). Maps WinFsp's FileSystemContext onto the platform-agnostic Provider. Windows-only."
license = "Apache-2.0"

[dependencies]
fs-provider = { path = "../fs-provider" }

# Windows-only: the WinFsp binding + helpers. On other platforms the crate compiles to
# an empty lib (everything real is behind `#[cfg(windows)]`), so it never breaks the
# macOS/Linux builds.
[target.'cfg(windows)'.dependencies]
# NOTE: not enabling the `system` feature — it makes winfsp-sys bindgen against the
# *installed* WinFsp SDK headers (which a runtime-only install lacks). The default uses
# bundled headers (builds anywhere WinFsp's DLL is present). Consequence: at runtime
# `winfsp-x64.dll` must be on the DLL search path — add `<WinFsp>\bin` to PATH, or bundle
# the DLL next to the binary. (For a distributable app, enable `system` + install the
# WinFsp SDK so the DLL loads from the registry InstallDir instead.)
winfsp = "0.13"
widestring = "1"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(windows)'.build-dependencies]
winfsp = "0.13"

[[bin]]
name = "maker-mount-win"
path = "src/bin/maker-mount-win.rs"
