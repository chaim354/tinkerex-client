[package]
name = "fs-provider"
version = "0.1.0"
edition = "2021"
description = "Local-first filesystem provider: SQLite tree + content-addressed chunk store. The seam every platform mount (FUSE/CfAPI/File Provider) is built against."
license = "Apache-2.0"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
fastcdc = "3"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# Property-based testing (MIT/Apache, dev-only — not shipped, so no §9 concern).
# Used by the chunking + convergence suites for shrinking to minimal reproducers.
proptest = "1"
