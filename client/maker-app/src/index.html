<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maker — Sync</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Maker</h1>
        <span id="statusPill" class="pill" role="status" aria-live="polite">
          <span class="dot"></span><span id="statusText">disconnected</span>
        </span>
      </header>

      <!-- Connection -->
      <section class="card">
        <h2>Connection</h2>

        <div class="tabs" role="tablist" aria-label="How this device joins the library">
          <button id="tabNew" role="tab" aria-selected="true">This is my device</button>
          <button id="tabPair" role="tab" aria-selected="false">Pair with a code</button>
        </div>

        <label for="server">Sync server URL</label>
        <input id="server" value="http://localhost:3001" autocomplete="off" spellcheck="false" />
        <div class="field-err" id="serverErr"></div>

        <label for="email">Account email</label>
        <input id="email" value="maker@example.com" autocomplete="off" spellcheck="false" />
        <div class="field-err" id="emailErr"></div>

        <div id="pairRow" class="hidden">
          <label for="code">Pairing code (from a signed-in device)</label>
          <input id="code" class="code" placeholder="ABCD2345" autocomplete="off" spellcheck="false" />
          <div class="field-err" id="codeErr"></div>
        </div>

        <label id="mountLabel" for="mount">Mount point</label>
        <input id="mount" value="/tmp/MakerDrive" autocomplete="off" spellcheck="false" />
        <div class="field-err" id="mountErr"></div>

        <div class="row">
          <button id="mountBtn" class="primary">Mount &amp; sync</button>
          <button id="unmountBtn" disabled>Unmount</button>
        </div>
        <div id="connToast" class="toast hidden" role="alert"></div>
      </section>

      <!-- Devices -->
      <section class="card">
        <h2>Add another device</h2>
        <p class="muted">Generate a one-time code, then enter it on the other device under
          “Pair with a code”. The code expires in 10 minutes.</p>
        <div class="row" style="margin-top:0.6rem">
          <button id="pairCodeBtn">Generate pairing code</button>
        </div>
        <div id="codeboxWrap" class="codebox-wrap hidden">
          <div id="codebox" class="codebox" aria-label="Pairing code"></div>
          <button id="copyCodeBtn" title="Copy code">Copy</button>
        </div>
        <div id="pairToast" class="toast hidden" role="alert"></div>
      </section>

      <!-- Files -->
      <section class="card">
        <h2>Files &amp; versions</h2>
        <div class="row" style="margin-top:0">
          <button id="refreshFilesBtn">Refresh files</button>
          <span id="filesHint" class="muted" style="align-self:center"></span>
        </div>
        <div id="files" class="files hidden" role="tree" aria-label="Library files"></div>
      </section>
    </div>

    <!-- Conflict resolution -->
    <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="conflictTitle">
      <div class="modal">
        <div class="modal-head">
          <div>
            <h3 id="conflictTitle">This file changed in two places</h3>
            <span id="conflictCount" class="conflict-count"></span>
          </div>
          <button id="conflictClose" class="modal-close" aria-label="Close — decide later">&times;</button>
        </div>
        <p class="muted" id="conflictName"></p>
        <p class="muted">Two versions diverged (someone edited offline). Which is current?</p>
        <div class="sides">
          <div class="sidecard server" id="sideCurrent"></div>
          <div class="sidecard incoming" id="sideIncoming"></div>
        </div>
        <button class="split" id="splitBtn">Keep both — save the other as a separate copy</button>
        <div id="conflictErr" class="modal-err"></div>
      </div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
