[package]
name = "maker-app"
version = "0.2.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "maker_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Windows mount backend is CfAPI (driverless) by default; opt back into the legacy WinFsp
# (drive-letter) backend with `--features winfsp-backend`. Kept for one release post-B5 flip.
winfsp-backend = []

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The native sync daemon (mount + sync loop + nudge). The mount backend is chosen
# per-OS inside sync-engine: Linux = FUSE, macOS = WebDAV, Windows = CfAPI (driverless;
# WinFsp behind the `winfsp-backend` feature).
sync-engine = { path = "../../sync-engine" }
sync-client = { path = "../../sync-client" }
