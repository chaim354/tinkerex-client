[package]
name = "maker-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "maker_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The native sync daemon (mount + sync loop + nudge). fs-fuse builds on `fuser`, which
# is Unix-only, so the mount backend is gated to macOS/Linux. On Windows the app still
# builds and launches — the mount commands return a "not yet supported" error until the
# winfsp-rs adapter (CLAUDE.md §12 step 4) lands.
[target.'cfg(not(target_os = "windows"))'.dependencies]
sync-engine = { path = "../../sync-engine" }
sync-client = { path = "../../sync-client" }
