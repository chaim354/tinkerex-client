[package]
name = "stl-thumbnailer"
version = "0.1.0"
edition = "2021"
description = "GL-free, pure-CPU STL -> PNG thumbnail renderer. Software rasterizer (euc); no GPU/OpenGL/wgpu/X11/Mesa. Baked into the Rails Docker image AND the Tauri desktop core."
license = "Apache-2.0"

[lib]
name = "stl_thumbnailer"
path = "src/lib.rs"

[[bin]]
name = "stl-thumbnailer"
path = "src/main.rs"

[dependencies]
# Pure-software CPU rasterizer (z-buffer + programmable shaders in plain Rust).
# We use the crates.io 0.5.3 release: it is `#![no_std]`, pulls in ONLY `vek` (no GPU/
# GL/wgpu/X11/Mesa), and renders correctly here. (The `master`/0.6.0 branch the research
# pass suggested was tried and pinned, but its rasterizer produced empty frames on this
# commit — see crate README/notes; 0.5.3 is verified working.) License: Apache-2.0 / MIT.
euc = "0.5.3"
# Linear algebra + the Vec3/Mat4/Rgba types. Pinned to 0.14 to MATCH euc 0.5.3's own vek,
# so our `Vec3<f32>` satisfies euc's `Interpolate` bound (the VsOut normal we pass through).
# License: MIT.
vek = { version = "0.14", default-features = false, features = ["rgba", "std"] }
# Parse binary AND ASCII STL -> indexed triangles with normals. License: MIT.
stl_io = "0.8"
# Encode RGBA buffer -> PNG. License: MIT-or-Apache.
image = { version = "0.25", default-features = false, features = ["png"] }
anyhow = "1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
