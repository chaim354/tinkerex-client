[package]
name = "sync-engine"
version = "0.1.0"
edition = "2021"
description = "The daemon: bridges fs-provider (local tree + chunk cache) and sync-client (server API) to push local changes and pull remote ones. Pluggable chunk transport."
license = "Apache-2.0"

[dependencies]
fs-provider = { path = "../fs-provider" }
fs-webdav = { path = "../fs-webdav" }
sync-client = { path = "../sync-client" }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

# The FUSE mount (`Daemon`) is used on Linux/Windows; macOS mounts via WebDAV, so
# `fuser` (and the FUSE-T it needs to build) is excluded there entirely.
[target.'cfg(not(target_os = "macos"))'.dependencies]
fs-fuse = { path = "../fs-fuse" }
fuser = "0.14"
libc = "0.2"
