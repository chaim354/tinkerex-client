[package]
name = "sync-engine"
version = "0.1.0"
edition = "2021"
description = "The daemon: bridges fs-provider (local tree + chunk cache) and sync-client (server API) to push local changes and pull remote ones. Pluggable chunk transport."
license = "Apache-2.0"

[dependencies]
fs-provider = { path = "../fs-provider" }
fs-webdav = { path = "../fs-webdav" }
sync-client = { path = "../sync-client" }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
# Chunk-integrity verification on the hydrate path: recompute sha256(bytes) and compare to the
# content-addressed manifest hash so corrupt/truncated bytes from object storage are rejected,
# never cached and served as file content. MUST be the SAME hash as the chunk addressing
# (fs-provider's commit path / sync-client's manifest_id), i.e. hex(Sha256(bytes)).
sha2 = "0.10"
hex = "0.4"

# Per-OS mount backend: Linux = FUSE (`Daemon`), Windows = WinFsp (`WinfspMount`),
# macOS = WebDAV (`WebdavMount`, cross-platform deps above). `fuser` is Unix-only and
# unused on macOS, so it's strictly Linux here.
[target.'cfg(target_os = "linux")'.dependencies]
fs-fuse = { path = "../fs-fuse" }
# fuser 0.17: the abi-7-xx feature flags are gone (ignored as of 0.16, removed in 0.18) —
# BackgroundSession::notifier() + Notifier::inval_inode (active cache invalidation on a
# content-changing pull, see EngineInvalidate) are now always available, no feature gate.
fuser = "0.17"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
fs-winfsp = { path = "../fs-winfsp" }
# CfAPI is the driverless successor to WinFsp (the OneDrive model). Both compile on
# Windows; the active backend is chosen at the CALL SITE, and the call site is the Tauri app:
# maker-app/src-tauri/src/lib.rs sets `type Mount = sync_engine::CfApiMount` by DEFAULT, with
# WinfspMount behind `--features winfsp-backend` (kept for one release post-flip).
# CfAPI IS THE SHIPPING DEFAULT -- the flip happened after a live smoke test and a byte-for-byte
# verification on real hardware. This comment claimed the opposite ("WinfspMount stays the default
# until CfApiMount is proven on real hardware") until 2026-08-25; it predated the flip and was
# found by an audit, not by anything going red -- a stale comment cannot fail a build.
# See docs/plan-windows-cfapi-migration.md.
fs-cfapi = { path = "../fs-cfapi" }
